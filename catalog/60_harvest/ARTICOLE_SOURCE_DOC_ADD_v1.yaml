    posting_eligible: true
    emit_on_incomplete: false
    primary:
      required_kinds: [pdf]
      companions_are: additional
      missing_aisle: "40_extras/_incomplete/"
    pairing:
      with: []
      key: [date]
    extract:
      backend: document_ai
