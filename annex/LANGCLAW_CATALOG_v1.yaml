  - articol_id: bon_combustibil_100
    schema_version: "1"
    filters:
      nature_code: combustibil
      A_band: le_100
    require:
      tva: [tva_platitor]
      auto: [auto_economic_100]
    forbid: {}
    fiscal_cheltuiala: full
    tva_deducere: full
    cont_cheltuiala: "6022"
    tva_cont: "4426"
    write_module: bon_via_nota

  - articol_id: bon_combustibil_50
    schema_version: "1"
    filters:
      nature_code: combustibil
      A_band: le_100
    require:
      tva: [tva_platitor]
      auto: [auto_mixed_50]
    forbid: {}
    fiscal_cheltuiala: partial_50
    tva_deducere: partial_50
    cont_cheltuiala: "6022"
    tva_cont: "4426"
    write_module: bon_via_nota

  - articol_id: bon_combustibil_auto_unknown
    schema_version: "1"
    filters:
      nature_code: combustibil
    require:
      auto: [auto_unknown]
    forbid: {}
    fiscal_cheltuiala: hitl
    tva_deducere: hitl
    write_module: bon_via_nota

  - articol_id: bon_protocol
    schema_version: "1"
    filters:
      nature_code: protocol
      A_band: le_100
    require:
      tva: [tva_platitor]
    forbid: {}
    fiscal_cheltuiala: partial_50
    tva_deducere: partial_50
    cont_cheltuiala: "623"
    tva_cont: "4426"
    write_module: bon_via_nota
    hitl_note: "confirm protocol vs diurna vs personal"

  - articol_id: bon_altele
    schema_version: "1"
    filters:
      nature_code: altele
    require: {}
    forbid: {}
    fiscal_cheltuiala: hitl
    tva_deducere: hitl
    write_module: bon_via_nota

# ---------------------------------------------------------------------------
# explained_sink_only starters (V2)
# ---------------------------------------------------------------------------
explained_rules:
  - rule_id: payroll_d112
    schema_version: "1"
    status: draft
    matcher:
      accounts_any: ["421", "641"]
      text_prefix: ["salari"]
    require: {}
    forbid: {}
  - rule_id: tva_settlement
    schema_version: "1"
    matcher:
      accounts_any: ["4423", "4426", "4427"]
      text_prefix: ["regularizare tva", "inchidere tva"]
    require:
      tva: [tva_platitor]
    forbid: {}

# ---------------------------------------------------------------------------
# MatchContext key map (documentation)
# ---------------------------------------------------------------------------
context_keys:
  axes: [forma, impozit, tva, exig, efact, saf_t, auto, rol]
  filters: [graph_id, fiscal_class, our_role, nature_code, A_band]
  extra_filters_on_job: [our_cui_on_doc, is_storno]
)
