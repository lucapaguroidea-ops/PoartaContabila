# LANGCLAW_CATALOG_v1.yaml
# status: draft — Lane B; not live until accountant approve + copy-firm fixtures
# schema_version of this file: "1"
# matching: require ⊆ MatchContext, forbid ∩ ctx = ∅, filters exact
# jobs freeze articol_version / module schema_version / client_type_hash

file_schema: "1"
status: draft
valid_from: "2026-01-01"
valid_to: null

# ---------------------------------------------------------------------------
# Year pins (copied onto CO.DiT at seed; do not live-join at emit)
# ---------------------------------------------------------------------------
pins:
  id: pins_ro_2026
  schema_version: "1"
  status: draft
  year: 2026
  tva_standard_pct: "21"
  tva_redus_pct: "11"
  tva_super_redus_pct: "5"
  micro_rate_pct: "1"
  tva_scutire_plafon_ron: "395000"
  tva_incasare_plafon_ron: "5000000"
  bon_simplificat_eur: "100"
  bon_simplificat_upper_eur: "400"   # only with MF order — HITL
  fx_policy: BNR_exigibilitate

# ---------------------------------------------------------------------------
# ArticoleGraph — compiled machines (app picks these, not MatchContext)
# ---------------------------------------------------------------------------
graphs:
  - graph_id: folder_triage
    schema_version: "1"
    status: draft
    thread_prefix: batch
    state_schema: BatchState
    allowed_flux: [triage_place, triage_pair_efactura, triage_bon_fork, triage_extras]
  - graph_id: ingest_source_doc
    schema_version: "1"
    thread_prefix: job
    state_schema: DocState
    allowed_flux:
      - ro_efactura_inbound
      - ro_efactura_outbound
      - foreign_invoice_inbound
      - foreign_invoice_outbound
      - bon_cu_cui
      - bon_fara_cui
      - extras_statement
      - storno_iesire
      - storno_intrare
  - graph_id: monthly_close
    schema_version: "1"
    thread_prefix: close
    state_schema: CloseState
    allowed_flux: [close_standard, close_tva_incasare]

# ---------------------------------------------------------------------------
# WriteModule — SAGA mouths (flux names these ids)
# ---------------------------------------------------------------------------
write_modules:
  - module_id: parteneri_xml
    schema_version: "1"
    status: draft
    saga_path: import_xml
    validare: n_a
    backup: before_batch
    hitl: first_n
    first_n: 5
    max_docs_per_run: 50
  - module_id: articole_xml
    schema_version: "1"
    saga_path: import_xml
    validare: n_a
    backup: before_batch
    hitl: first_n
    first_n: 5
    max_docs_per_run: 50
  - module_id: intrare_factura_xml
    schema_version: "1"
    saga_path: import_xml
    validare: human
    backup: before_batch
    hitl: first_n
    first_n: 5
    max_docs_per_run: 20
  - module_id: iesire_factura_xml
    schema_version: "1"
    saga_path: import_xml
    validare: human
    backup: before_batch
    hitl: first_n
    first_n: 5
    max_docs_per_run: 20
  - module_id: storno_intrare_xml
    schema_version: "1"
    saga_path: import_xml
    validare: human
    backup: before_each
    hitl: always
    max_docs_per_run: 5
  - module_id: storno_iesire_xml
    schema_version: "1"
    saga_path: import_xml
    validare: human
    backup: before_each
    hitl: always
    max_docs_per_run: 5
  - module_id: incasare_xml
    schema_version: "1"
    saga_path: import_xml
    validare: human
    backup: before_batch
    hitl: first_n
    first_n: 5
    max_docs_per_run: 20
  - module_id: plata_xml
    schema_version: "1"
    saga_path: import_xml
    validare: human
    backup: before_batch
    hitl: first_n
    first_n: 5
    max_docs_per_run: 20
  - module_id: nota_nc_dbf
    schema_version: "1"
    saga_path: import_dbf
    validare: human
    backup: before_each
    hitl: always
    max_docs_per_run: 5
  - module_id: bon_via_nota
    schema_version: "1"
    saga_path: import_dbf
    validare: human
    backup: before_each
    hitl: always
    max_docs_per_run: 10
    note: "until a proven bon XML exists on copy firm"

# ---------------------------------------------------------------------------
# ArticoleFlux — ingest + close + triage itineraries
# ---------------------------------------------------------------------------
flux:
  # ---- triage (no WriteModule) ----
  - articol_id: triage_place
    schema_version: "1"
    graph_id: folder_triage
    filters: {}
    require: {}
    forbid: {}
    write_modules: []
    hitl: never_if_risk_low
    route_key: place

  # ---- RO e-Factura ----
  - articol_id: ro_efactura_inbound
    schema_version: "1"
    graph_id: ingest_source_doc
    filters:
      fiscal_class: ro_efactura
      our_role: inbound
    require: {}
    forbid:
      rol: [mandat_contabil]
    write_modules: [parteneri_xml, articole_xml, intrare_factura_xml]
    maps_profile: achizitie_implicita
    hitl: first_n
    first_n: 5
    route_key: standard

  - articol_id: ro_efactura_outbound
    schema_version: "1"
    graph_id: ingest_source_doc
    filters:
      fiscal_class: ro_efactura
      our_role: outbound
    require: {}
    forbid:
      rol: [mandat_contabil]
    write_modules: [parteneri_xml, articole_xml, iesire_factura_xml]
    maps_profile: vanzare_implicita
    hitl: first_n
    first_n: 5
    route_key: standard

  # ---- foreign ----
  - articol_id: foreign_invoice_inbound
    schema_version: "1"
    graph_id: ingest_source_doc
    filters:
      fiscal_class: foreign_invoice
      our_role: inbound
    require: {}
    forbid: {}
    write_modules: [parteneri_xml, articole_xml, intrare_factura_xml]
    maps_profile: achizitie_ue_sau_ext
    hitl: always
    route_key: foreign

  - articol_id: foreign_invoice_outbound
    schema_version: "1"
    graph_id: ingest_source_doc
    filters:
      fiscal_class: foreign_invoice
      our_role: outbound
    require: {}
    forbid: {}
    write_modules: [parteneri_xml, articole_xml, iesire_factura_xml]
    maps_profile: vanzare_export
    hitl: always
    route_key: foreign

  # ---- bon: flux only splits CUI precondition; ArticolBon does A/B ----
  - articol_id: bon_cu_cui
    schema_version: "1"
    graph_id: ingest_source_doc
    filters:
      fiscal_class: bon
    require: {}
    forbid: {}
    extra_filters:
      our_cui_on_doc: true
    write_modules: [bon_via_nota]
    hitl: always
    route_key: bon_then_matrix

  - articol_id: bon_fara_cui
    schema_version: "1"
    graph_id: ingest_source_doc
    filters:
      fiscal_class: bon
    extra_filters:
      our_cui_on_doc: false
    require: {}
    forbid: {}
    write_modules: [bon_via_nota]
    hitl: always
    route_key: bon_fara_cui

  # ---- extras ----
  - articol_id: extras_statement
    schema_version: "1"
    graph_id: ingest_source_doc
    filters:
      fiscal_class: extras
    require: {}
    forbid: {}
    write_modules: [incasare_xml, plata_xml]
    hitl: first_n
    first_n: 3
    route_key: extras
    note: "lines later; one job per statement pack"

  # ---- storno ----
  - articol_id: storno_intrare
    schema_version: "1"
    graph_id: ingest_source_doc
    filters: {}
    require: {}
    forbid: {}
    write_modules: [storno_intrare_xml]
    hitl: always
    route_key: storno
    extra_filters:
      is_storno: true
      our_role: inbound

  - articol_id: storno_iesire
    schema_version: "1"
    graph_id: ingest_source_doc
    filters: {}
    require: {}
    forbid: {}
    write_modules: [storno_iesire_xml]
    hitl: always
    route_key: storno
    extra_filters:
      is_storno: true
      our_role: outbound

  # ---- close ----
  - articol_id: close_standard
    schema_version: "1"
    graph_id: monthly_close
    filters: {}
    require:
      tva: [tva_platitor, tva_neplatitor, tva_scutire_mici, tva_091]
    forbid:
      exig: [tva_la_incasare]
    write_modules: []
    hitl: always
    route_key: close

  - articol_id: close_tva_incasare
    schema_version: "1"
    graph_id: monthly_close
    filters: {}
    require:
      tva: [tva_platitor]
      exig: [tva_la_incasare]
    forbid: {}
    write_modules: []
    hitl: always
    route_key: close_4428

# ---------------------------------------------------------------------------
# ArticolContabilBonFiscal — Test B cells (CUI-on-bon already true unless noted)
# A_band from Test A; auto from CO.DiT
# ---------------------------------------------------------------------------
articol_bon:
  - articol_id: bon_tva_blocked_fara_cui
    schema_version: "1"
    status: draft
    filters:
      nature_code: null          # any nature
    extra_filters:
      our_cui_on_doc: false
    require: {}
    forbid: {}
    test_A_required: false
    fiscal_cheltuiala: hitl      # may still be activity expense
    tva_deducere: blocked_no_cui
    cont_cheltuiala: null
    tva_cont: null
    write_module: bon_via_nota

  - articol_id: bon_materiale_tva_full
    schema_version: "1"
    filters:
      nature_code: materiale
      A_band: le_100
    require:
      tva: [tva_platitor]
    forbid: {}
    test_A_required: true
    fiscal_cheltuiala: full
    tva_deducere: full
    cont_cheltuiala: "6028"
    tva_cont: "4426"
    write_module: bon_via_nota

  - articol_id: bon_materiale_tva_doc_fail
    schema_version: "1"
    filters:
      nature_code: materiale
