[project]
name = "poarta-contabila"
version = "0.1.0"
description = "Poarta Primară — Catalog Cale: hopper and pre-filing gate in front of SAGA C"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "langgraph>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "xlwt>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poarta_contabila"]

[tool.pytest.ini_options]
testpaths = ["tests", "fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["annex", "fixtures"]  # pack files kept as delivered

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
